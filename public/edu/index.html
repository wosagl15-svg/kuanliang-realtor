<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>成交教育資料庫</title>
<style>
 :root{
   --navy:#0f1f3d; --navy2:#1c3866; --gold:#d4af5a; --gold-ink:#8a6300;
   --bg:#f4f6fb; --card:#fff; --ink:#1c2333; --sub:#6b7489; --line:#e3e7f0;
   --quote:#fbf6e8; --err:#c0392b;
 }
 :root{color-scheme:light dark}
 @media(prefers-color-scheme:dark){
   :root{--bg:#101319;--card:#1b1f28;--ink:#e6e8ee;--sub:#96a0b5;--line:#2a2f3b;--quote:#2a2618;--gold-ink:#e2c17a;--err:#ff7b6b}
 }
 *{box-sizing:border-box}
 body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;margin:0;
   background:var(--bg);color:var(--ink);line-height:1.7;-webkit-text-size-adjust:100%}

 .banner{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 55%,#2a4a86 100%);color:#fff;padding:18px 16px}
 .banner h1{font-size:20px;margin:0;letter-spacing:1px}
 .banner p{font-size:12.5px;margin:2px 0 0;color:#cfe0ff}

 /* ---- 密碼閘門 ---- */
 .gate{max-width:360px;margin:12vh auto 0;padding:0 16px}
 .gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
 .gate h2{margin:0 0 4px;font-size:18px}
 .gate p{margin:0 0 18px;color:var(--sub);font-size:13.5px}
 .gate input{width:100%;font-size:22px;letter-spacing:8px;text-align:center;padding:10px;border-radius:10px;
   border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
 .gate input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
 .gate button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--navy2);
   color:#fff;font-size:15px;font-family:inherit;cursor:pointer}
 .gate button:disabled{opacity:.6;cursor:wait}
 .gate .msg{min-height:22px;margin-top:10px;font-size:13px;color:var(--err)}

 /* ---- 分頁 ---- */
 .nav{position:sticky;top:0;z-index:5;background:#152650;display:flex;gap:2px;padding:0 8px;overflow-x:auto;
   -webkit-overflow-scrolling:touch;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 @media(prefers-color-scheme:dark){.nav{background:#0b1120}}
 .nav button{background:none;border:0;color:#b9c8ea;padding:12px 12px;font-size:14px;cursor:pointer;
   white-space:nowrap;border-bottom:2px solid transparent;font-family:inherit}
 .nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}

 .wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
 article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px 18px}
 h1,h2,h3{line-height:1.4}
 article h1{font-size:21px;margin:18px 0 8px}
 article h2{font-size:17px;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--gold)}
 article h3{font-size:15.5px;margin:18px 0 6px}
 article p,article li{font-size:15px}
 article ul,article ol{padding-left:22px}
 article li{margin:3px 0}
 li.ck{list-style:none;margin-left:-22px}
 li.ck input{width:16px;height:16px;vertical-align:-3px;margin-right:6px;accent-color:var(--navy2)}
 blockquote{margin:12px 0;padding:10px 14px;background:var(--quote);border-left:4px solid var(--gold);border-radius:0 10px 10px 0}
 blockquote p{margin:4px 0}
 strong{color:var(--gold-ink)}
 @media(prefers-color-scheme:light){strong{color:#7a4f00}}
 .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
 table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
 th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
 th{background:rgba(28,56,102,.08);white-space:nowrap}
 a{color:#3b6fd4}
 .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:22px}
 .lock{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;
   font-size:12px;font-family:inherit;cursor:pointer;float:right;margin-top:2px}
</style>
</head>
<body>
<div class="banner">
  <button class="lock" id="lockBtn" hidden>鎖上</button>
  <h1>成交教育資料庫</h1>
  <p>海線冠良｜真實案件・去個資・內部訓練用</p>
</div>

<div class="gate" id="gate">
  <form class="box" id="form" autocomplete="off">
    <h2>請輸入密碼</h2>
    <p>這是內部教育資料，輸入密碼才能閱讀。</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="12" aria-label="密碼" autofocus>
    <button id="go" type="submit">進入</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <nav class="nav" id="nav"></nav>
  <div class="wrap"><article id="doc"></article>

const $ = (id) => document.getElementById(id);
const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const KEY = "edu_pw";

async function unlock(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: ub64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(DATA.iv) }, key, ub64(DATA.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function render(sections) {
  const nav = $("nav"), doc = $("doc");
  const show = (id) => {
    const s = sections.find((x) => x.id === id) || sections[0];
    doc.innerHTML = s.html;
    nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.id === s.id));
    try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
    window.scrollTo(0, 0);
  };
  sections.forEach((s) => {
    const b = document.createElement("button");
    b.textContent = s.title; b.dataset.id = s.id; b.type = "button";
    b.onclick = () => show(s.id);
    nav.appendChild(b);
  });
  $("gate").hidden = true; $("app").hidden = false; $("lockBtn").hidden = false;
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
}

async function tryOpen(pw, remember) {
  const sections = await unlock(pw);
  if (remember) { try { sessionStorage.setItem(KEY, pw); } catch (e) {} }
  render(sections);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) return;
  $("go").disabled = true; $("go").textContent = "解鎖中…"; $("msg").textContent = "";
  try { await tryOpen(pw, true); }
  catch (err) {
    $("msg").textContent = "密碼不對，請再試一次";
    $("pw").value = ""; $("pw").focus();
  } finally { $("go").disabled = false; $("go").textContent = "進入"; }
});

$("lockBtn").onclick = () => {
  try { sessionStorage.removeItem(KEY); } catch (e) {}
  location.hash = ""; location.reload();
};

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { await tryOpen(saved, false); } catch (e) {} }
})();
</script>
